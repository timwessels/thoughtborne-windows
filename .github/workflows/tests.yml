# Runs the off-Windows test ladder (run_tests.py -- every test_*.py driver in the
# repo root) on every push to main and every pull request.
#
# The drivers are standalone stdlib scripts, so the job needs no test framework and
# no venv: just a Python, three third-party packages and Xvfb. `soundfile` and
# `groq` are the only non-stdlib imports the ladder reaches off Windows -- groq is
# transcriber.py's one module-level third-party import, so without it the #206 Soniox
# constructor lane would skip instead of running -- and `pyflakes` is the engine of
# the undefined-name lane, so without it the #289 lane would skip instead of gating.
# `uv sync` is deliberately not usable here --
# pyproject.toml restricts resolution to sys_platform == 'win32', and PyAudio has no
# Linux wheels.
#
# Xvfb is installed but not invoked here: run_tests.py puts itself under `xvfb-run`,
# so CI runs the documented command and exercises that takeover on every push. The step
# below fails when the ladder fails AND when it did not take the display over -- an
# xvfb-run that cannot serve a display makes the ladder fall back to skipping, which is
# honest but green, and CI is the one place that must stay hard about it.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ladder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the ladder's dependencies
        run: |
          python -m pip install soundfile groq pyflakes
          # python3-tk brings the Tcl/Tk shared libraries the interpreter's
          # _tkinter links against; without them the display checks would skip.
          sudo apt-get update -qq && sudo apt-get install -qq -y xvfb python3-tk

      - name: Run the test ladder
        # No pipe in here: the job shell is `bash -e` WITHOUT `pipefail`, so a
        # `run_tests.py | tee` would hand the step tee's exit status and quietly turn a
        # red ladder green -- worse than the hole this step closes.
        run: |
          python run_tests.py > ladder.log || { cat ladder.log; exit 1; }
          cat ladder.log
          # The head of run_tests.py's `Display:` line. Reword that line and this grep
          # must follow -- it then fails the step loudly, so it cannot drift unnoticed.
          grep -q '^Display: xvfb-run' ladder.log || {
            echo "::error::the ladder did not take the display over, so its display-gated checks skipped"
            exit 1
          }
