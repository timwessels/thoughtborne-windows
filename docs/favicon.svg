<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- Pixel mark decoded from console_ui.py's LOGO_MARK_A5 — the same glyph the
       masthead's .lg-mark renders in half-blocks; regenerate when that art changes.
       Half-unit offsets centre the 7x6 grid in the 8x8 viewBox so cell edges land
       on whole device pixels at 16/32/48 px. Navy on light chrome; dark chrome
       gets the console accent, matching the masthead. -->
  <style>
    rect { fill: #0E202E; }
    @media (prefers-color-scheme: dark) { rect { fill: #59C2FF; } }
  </style>
  <rect x="2.5" y="1" width="3" height="1"/>
  <rect x="1.5" y="2" width="5" height="1"/>
  <rect x="1.5" y="3" width="6" height="1"/>
  <rect x="0.5" y="4" width="1" height="1"/>
  <rect x="3.5" y="4" width="4" height="1"/>
  <rect x="1.5" y="5" width="2" height="1"/>
  <rect x="5.5" y="5" width="1" height="1"/>
  <rect x="2.5" y="6" width="2" height="1"/>
</svg>
